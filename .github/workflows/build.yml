# Builds the production images on every push to main and pushes them to GHCR
# as :<commit sha> and :latest. Nothing is deployed from here; see
# deploy/README.md.
name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Pages that read the database at build time get an empty, migrated one.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pacsaz
          POSTGRES_PASSWORD: pacsaz
          POSTGRES_DB: pacsaz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pacsaz" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pacsaz:pacsaz@localhost:5432/pacsaz?schema=public
      # Inlined into the client bundle at build time.
      NEXT_PUBLIC_MAIN_URL: https://pacsaz.ir
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db exec prisma generate
      - run: pnpm --filter @repo/db exec prisma migrate deploy

      - name: Build the apps
        run: pnpm turbo run build --filter=client --filter=admin

      # standalone holds the server and traced node_modules; static assets and
      # public/ are copied next to server.js, as Next.js expects.
      - name: Collect standalone output
        run: |
          for app in client admin; do
            out="out/$app"
            mkdir -p "$out"
            cp -a "apps/$app/.next/standalone/." "$out/"
            mkdir -p "$out/apps/$app/.next"
            cp -a "apps/$app/.next/static" "$out/apps/$app/.next/static"
            if [ -d "apps/$app/public" ]; then cp -a "apps/$app/public" "$out/apps/$app/public"; fi
            test -f "$out/apps/$app/server.js"
          done

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: client
          build-args: |
            APP=client
            APP_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/pacsaz-client:${{ github.sha }}
            ${{ env.REGISTRY }}/pacsaz-client:latest

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: admin
          build-args: |
            APP=admin
            APP_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/pacsaz-admin:${{ github.sha }}
            ${{ env.REGISTRY }}/pacsaz-admin:latest

      - name: Build and push tools
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: tools
          build-args: APP_VERSION=${{ github.sha }}
          push: true
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max
          tags: |
            ${{ env.REGISTRY }}/pacsaz-tools:${{ github.sha }}
            ${{ env.REGISTRY }}/pacsaz-tools:latest
