# Deploys a built commit to the server. Manual only for now: Actions → Deploy
# → Run workflow (leave the sha empty for the latest build; give an older sha
# to roll back). The `pacsaz-deploy` key can only run /opt/pacsaz/deploy.sh.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit sha to deploy (empty = latest build)
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ inputs.sha }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes pacsaz-deploy@91.107.179.58 "${SHA:-latest}"
